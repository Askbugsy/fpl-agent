name: "Temporary debug: check classic leagues"

# One-off diagnostic - manually triggered, not scheduled. Prints every
# classic league your entry is in (id, name, type) to the job log, and
# flags any whose name mentions "Takeda", so we can confirm whether
# it's visible via FPL's public API and what league_type it reports as
# (e.g. "x" = invitational/private classic, "s" = general/public
# classic). Reads only - no data is saved anywhere. Remove this
# workflow file once the answer's confirmed.
on:
  workflow_dispatch: {}

jobs:
  check-leagues:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests==2.32.3

      - name: Fetch and print classic leagues
        run: |
          python3 - <<'EOF'
          import requests

          resp = requests.get("https://fantasy.premierleague.com/api/entry/6738704/", timeout=10)
          resp.raise_for_status()
          data = resp.json()

          classic = data.get("leagues", {}).get("classic", [])
          print(f"Total classic leagues: {len(classic)}\n")
          for l in classic:
              print(f"id={l.get('id'):<10} type={l.get('league_type'):<3} name={l.get('name')}")

          print("\n--- Matches for 'takeda' (case-insensitive) ---")
          matches = [l for l in classic if "takeda" in (l.get("name") or "").lower()]
          if matches:
              for l in matches:
                  print(l)
          else:
              print("No match found.")
          EOF
