name: Debug - Photo CDN size check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare legacy vs current CDN bucket for a player with a known kit change
        run: |
          # Mbeumo (code 446008) transferred Brentford -> Man Utd for 25/26 -
          # premierleague25/110x140/446008.png (current pattern) is confirmed
          # showing the correct Man Utd kit against the real site. Comparing
          # byte size against the legacy p-prefixed URL as a proxy for
          # "is this the same image or a stale one".
          for url in \
            "https://resources.premierleague.com/premierleague25/photos/players/110x140/446008.png" \
            "https://resources.premierleague.com/premierleague/photos/players/110x140/p446008.png"; do
            code=$(curl -s -o /tmp/out.png -w "%{http_code}" "$url")
            size=$(stat -c%s /tmp/out.png 2>/dev/null || echo 0)
            sha=$(sha256sum /tmp/out.png | cut -d' ' -f1)
            echo "$url -> HTTP ${code}, ${size} bytes, sha256 ${sha}"
          done
