name: Debug - Photo CDN size check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check photo sizes against real CDN
        run: |
          # Mbeumo (code 446008), confirmed working at 110x140 on 2026-08-25.
          for size in 40x40 110x140 250x250 300x300; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://resources.premierleague.com/premierleague25/photos/players/${size}/446008.png")
            echo "446008 @ ${size}: HTTP ${code}"
          done
